name: Setup Mac signing
description: Require Apple signing secrets, import Developer ID into a temp keychain, validate notarytool credentials.

inputs:
  csc_link:
    description: Base64-encoded Developer ID Application .p12 (CSC_LINK)
    required: true
  csc_key_password:
    description: Password for the .p12
    required: true
  apple_api_key:
    description: App Store Connect API .p8 (PEM or base64)
    required: true
  apple_api_key_id:
    description: App Store Connect API key id
    required: true
  apple_api_issuer:
    description: App Store Connect Issuer UUID
    required: true
  apple_team_id:
    description: Apple Team ID
    required: true

runs:
  using: composite
  steps:
    - name: Require Mac signing secrets
      shell: bash
      env:
        CSC_LINK: ${{ inputs.csc_link }}
        CSC_KEY_PASSWORD: ${{ inputs.csc_key_password }}
        APPLE_API_KEY: ${{ inputs.apple_api_key }}
        APPLE_API_KEY_ID: ${{ inputs.apple_api_key_id }}
        APPLE_API_ISSUER: ${{ inputs.apple_api_issuer }}
        APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
      run: |
        set -euo pipefail
        missing=0
        for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
          if [ -z "${!name}" ]; then
            echo "::error::Missing required Mac signing secret: $name"
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          echo "::error::Add Developer ID + App Store Connect API secrets before publishing Mac DMGs."
          exit 1
        fi

    - name: Prepare Mac signing materials
      shell: bash
      env:
        CSC_LINK_B64: ${{ inputs.csc_link }}
        CSC_KEY_PASSWORD: ${{ inputs.csc_key_password }}
        APPLE_API_KEY: ${{ inputs.apple_api_key }}
        APPLE_API_KEY_ID: ${{ inputs.apple_api_key_id }}
        APPLE_API_ISSUER: ${{ inputs.apple_api_issuer }}
      run: bash scripts/ci-mac-prepare-signing.sh
