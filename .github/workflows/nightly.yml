name: Nightly

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.new_commits != '0' }}
      version: ${{ steps.version.outputs.next }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check for new commits since last nightly
        id: check
        run: |
          git fetch --tags
          latest_nightly=$(git tag -l 'v*-nightly.*' | sort -V | tail -1 || true)
          if [ -n "$latest_nightly" ]; then
            new_commits=$(git rev-list "${latest_nightly}..HEAD" --count 2>/dev/null || echo "1")
          else
            new_commits=1
          fi
          echo "new_commits=$new_commits" >> "$GITHUB_OUTPUT"

      - name: Set nightly version
        if: steps.check.outputs.new_commits != '0'
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('-')[0]")
          date=$(date -u +%Y%m%d)
          next="${base}-nightly.${date}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          git fetch --tags
          if git rev-parse "v${next}" >/dev/null 2>&1; then
            echo "::error::Tag v${next} already exists"
            exit 1
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            builder-target: mac
          - os: windows-latest
            platform: win
            builder-target: win
          - os: ubuntu-latest
            platform: linux
            builder-target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Stamp version
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

      - name: Build installers
        run: npm run build -- --${{ matrix.builder-target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: betterdb-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
          path: |
            release/${{ needs.prepare.outputs.version }}/*.dmg
            release/${{ needs.prepare.outputs.version }}/*.exe
            release/${{ needs.prepare.outputs.version }}/*.AppImage
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Tag nightly
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.prepare.outputs.version }}"
          git push origin "v${{ needs.prepare.outputs.version }}"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: betterdb-${{ needs.prepare.outputs.version }}-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.commit_sha }}
          name: BetterDB v${{ needs.prepare.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.AppImage
