name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and clobber assets even if a complete release already exists
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      version: ${{ steps.decide.outputs.version }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [ "$version" = "0.0.0" ]; then
            echo "::error::Bump package.json on dev before merging to main"
            exit 1
          fi

          if echo "$version" | grep -q '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # workflow_dispatch can force a rebuild of the version on main.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch for v${version}"
          else
            # Require this push to come from a merged PR whose head was `dev`.
            pr_json=$(gh api "repos/${GH_REPO}/commits/${SHA}/pulls" \
              -H "Accept: application/vnd.github.groot-preview+json" || echo "[]")
            head_ref=$(echo "$pr_json" | jq -r '
              map(select(.base.ref == "main" and .merged_at != null))
              | .[0].head.ref // empty
            ')
            if [ -z "$head_ref" ]; then
              # Squash merges usually associate via the commits API; if not, try
              # message "(#N)" but only when this SHA is that PR's merge commit
              # (avoids triggering a release from an unrelated push that cites
              # an old dev→main PR number).
              pr_num=$(git log -1 --pretty=%B | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
              if [ -n "$pr_num" ]; then
                pr_meta=$(gh pr view "$pr_num" --repo "$GH_REPO" \
                  --json headRefName,baseRefName,mergeCommit || true)
                head_ref=$(echo "$pr_meta" | jq -r '.headRefName // empty')
                base_ref=$(echo "$pr_meta" | jq -r '.baseRefName // empty')
                merge_sha=$(echo "$pr_meta" | jq -r '.mergeCommit.oid // empty')
                if [ "$base_ref" != "main" ] || [ "$merge_sha" != "$SHA" ]; then
                  head_ref=""
                fi
              fi
            fi

            if [ "$head_ref" != "dev" ]; then
              echo "Push to main is not from a merged dev→main PR (head=${head_ref:-none}); skipping release"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Confirmed merged PR from dev → main"
          fi

          tag="v${version}"
          git fetch --tags --force

          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            installer_count=$(gh release view "$tag" --repo "$GH_REPO" --json assets \
              --jq '[.assets[].name] | map(select(test("\\.(dmg|exe|AppImage)$"))) | length')
            echo "Existing release ${tag} has ${installer_count} installer(s)"
            if [ "$installer_count" -ge 3 ] && [ "$FORCE" != "true" ]; then
              echo "Complete release already exists; skipping (use workflow_dispatch force=true to rebuild)"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Incomplete or forced rebuild — will clobber assets"
          elif git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag ${tag} exists without a complete release; will recreate/upload"
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "Building production release v${version} at ${SHA}"

  build:
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            builder-target: mac
          - os: windows-2022
            platform: win
            builder-target: win
          - os: ubuntu-latest
            platform: linux
            builder-target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: ./.github/actions/setup-node-build

      - name: Setup Mac signing
        if: matrix.platform == 'mac'
        uses: ./.github/actions/setup-mac-signing
        with:
          csc_link: ${{ secrets.CSC_LINK }}
          csc_key_password: ${{ secrets.CSC_KEY_PASSWORD }}
          apple_api_key: ${{ secrets.APPLE_API_KEY }}
          apple_api_key_id: ${{ secrets.APPLE_API_KEY_ID }}
          apple_api_issuer: ${{ secrets.APPLE_API_ISSUER }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Mac installer (signed + notarized)
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          npm run build -- --mac --publish never
        env:
          # Do not set CSC_LINK / CSC_KEY_PASSWORD — works around electron-builder #10066
          CSC_IDENTITY_AUTO_DISCOVERY: true
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify Mac signature
        if: matrix.platform == 'mac'
        uses: ./.github/actions/verify-mac-signature
        with:
          version: ${{ needs.gate.outputs.version }}

      - name: Build installers (unsigned)
        if: matrix.platform != 'mac'
        run: npm run build -- --${{ matrix.builder-target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Stage installer and update metadata
        uses: ./.github/actions/stage-installers
        with:
          version: ${{ needs.gate.outputs.version }}
          platform: ${{ matrix.platform }}
          include_ota: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: betterdb-${{ needs.gate.outputs.version }}-${{ matrix.platform }}
          path: staged/*
          if-no-files-found: error

  publish:
    needs: [gate, build]
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: betterdb-${{ needs.gate.outputs.version }}-*
          merge-multiple: true

      - name: Collect installers and update metadata
        run: |
          set -euo pipefail
          mkdir -p installers
          shopt -s nullglob
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            if [ "$base" = "builder-debug.yml" ]; then
              continue
            fi
            cp "$f" installers/
          done
          count=$(find installers -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' \) | wc -l | tr -d ' ')
          echo "Release upload set:"
          ls -la installers
          if [ "$count" -ne 3 ]; then
            echo "::error::Expected exactly 3 installers (mac/win/linux), found $count"
            find artifacts -type f | sort || true
            exit 1
          fi

      - name: Publish GitHub Release
        uses: ./.github/actions/publish-github-release
        with:
          version: ${{ needs.gate.outputs.version }}
          target_sha: ${{ needs.gate.outputs.sha }}
          prerelease: ${{ needs.gate.outputs.prerelease }}
          make_latest: ${{ needs.gate.outputs.prerelease == 'true' && 'false' || 'true' }}
          release_name: BetterDB v${{ needs.gate.outputs.version }}
          files_dir: installers
          min_installers: "3"
          allow_incomplete_clobber: "true"
