name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  gate:
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      prerelease: ${{ steps.pkg.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: pkg
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if echo "$version" | grep -q '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if version is placeholder
        run: |
          if [ "${{ steps.pkg.outputs.version }}" = "0.0.0" ]; then
            echo "::error::Bump package.json on dev before merging to main"
            exit 1
          fi

      - name: Fail if tag already exists
        run: |
          git fetch --tags
          if git rev-parse "v${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.pkg.outputs.version }} already exists"
            exit 1
          fi

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            builder-target: mac
          - os: windows-2022
            platform: win
            builder-target: win
          - os: ubuntu-latest
            platform: linux
            builder-target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Rebuild native modules for Electron
        run: npx --yes @electron/rebuild -f -w better-sqlite3
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit

      - name: Require Mac signing secrets
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required Mac signing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add Developer ID + App Store Connect API secrets before publishing Mac DMGs."
            exit 1
          fi

      - name: Prepare Mac signing materials
        if: matrix.platform == 'mac'
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/ci-mac-prepare-signing.sh

      - name: Build Mac installer (signed + notarized)
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          npm run build -- --mac --publish never
        env:
          # Do not set CSC_LINK / CSC_KEY_PASSWORD — works around electron-builder #10066
          # (set-key-partition-list gets the wrong password when using CSC_LINK on macOS 26).
          CSC_IDENTITY_AUTO_DISCOVERY: true
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify Mac code signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.gate.outputs.version }}"
          app=$(find "release/${version}" -maxdepth 2 -name "*.app" | head -1)
          if [ -z "$app" ]; then
            echo "::error::No .app found under release/${version}"
            ls -la "release/${version}" || true
            exit 1
          fi
          echo "Verifying $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          if codesign -dv --verbose=2 "$app" 2>&1 | grep -qi 'Signature=adhoc'; then
            echo "::error::Mac app is adhoc-signed; Developer ID signing did not apply"
            codesign -dv --verbose=2 "$app" 2>&1 || true
            exit 1
          fi
          if ! codesign -dv --verbose=2 "$app" 2>&1 | grep -q 'Authority=Developer ID Application'; then
            echo "::error::Expected Developer ID Application authority on signed app"
            codesign -dv --verbose=2 "$app" 2>&1 || true
            exit 1
          fi

      - name: Build installers (unsigned)
        if: matrix.platform != 'mac'
        run: npm run build -- --${{ matrix.builder-target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Stage installer and update metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.gate.outputs.version }}"
          mkdir -p staged
          shopt -s nullglob
          for f in \
            "release/${version}"/BetterDB-*-Installer.dmg \
            "release/${version}"/BetterDB-*-Setup.exe \
            "release/${version}"/BetterDB-Linux-*.AppImage
          do
            cp "$f" staged/
          done
          installer_count=$(find staged -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' \) | wc -l | tr -d ' ')
          if [ "$installer_count" -ne 1 ]; then
            echo "::error::Expected exactly 1 installer for ${{ matrix.platform }}, found $installer_count"
            ls -la "release/${version}" || true
            ls -la staged || true
            exit 1
          fi
          # electron-updater feed files (yml + blockmap) and Mac zip for silent OTA.
          for f in \
            "release/${version}"/*.yml \
            "release/${version}"/*.blockmap \
            "release/${version}"/BetterDB-*-Installer.zip
          do
            cp "$f" staged/
          done
          echo "Staged artifacts:"
          ls -la staged

      - uses: actions/upload-artifact@v4
        with:
          name: betterdb-${{ needs.gate.outputs.version }}-${{ matrix.platform }}
          path: staged/*
          if-no-files-found: error

  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: betterdb-${{ needs.gate.outputs.version }}-*
          merge-multiple: true

      - name: Collect installers and update metadata
        run: |
          set -euo pipefail
          mkdir -p installers
          shopt -s nullglob
          for f in \
            artifacts/BetterDB-*-Installer.dmg \
            artifacts/BetterDB-*-Setup.exe \
            artifacts/BetterDB-Linux-*.AppImage
          do
            cp "$f" installers/
          done
          count=$(find installers -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' \) | wc -l | tr -d ' ')
          echo "Installer files:"
          ls -la installers
          if [ "$count" -ne 3 ]; then
            echo "::error::Expected exactly 3 installers (mac/win/linux), found $count"
            echo "Downloaded artifacts:"
            find artifacts -type f | sort
            exit 1
          fi
          for f in \
            artifacts/*.yml \
            artifacts/*.blockmap \
            artifacts/BetterDB-*-Installer.zip
          do
            cp "$f" installers/
          done
          echo "Release upload set:"
          ls -la installers

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BetterDB v${{ needs.gate.outputs.version }}
          prerelease: ${{ needs.gate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: installers/*
